[project]
name = "clustop"
version = "0.1.0"
description = "htop/nvitop-style live view of CPU, RAM and GPU across any set of SSH hosts (GPU clusters, lab servers...)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ivan Zhytkevych" }]
keywords = ["gpu", "cluster", "monitoring", "nvidia-smi", "slurm", "ssh", "htop", "tui"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
requires-python = ">=3.11"
dependencies = ["rich>=13"]

[project.urls]
Homepage = "https://github.com/aipyth/clustop"
Issues = "https://github.com/aipyth/clustop/issues"

[project.scripts]
clustop = "clustop.app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
